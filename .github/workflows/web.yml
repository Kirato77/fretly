name: Web bundle

# Every push to main publishes the web app as a GitHub release. Installed copies of Fretly
# pick it up on launch (src/updater.ts) and switch to it on the next restart.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-release

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit (a moved tag cannot change them); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no repo token left in .git for the build steps

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Version from commit time
        run: echo "VITE_APP_VERSION=0.1.$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
          BUNDLE_PRIVATE_KEY: ${{ secrets.BUNDLE_PRIVATE_KEY }}
        run: |
          tag="web-$VITE_APP_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already published"; exit 0; fi
          (cd dist && zip -qr ../bundle.zip .)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/bundle.zip"
          # Encrypt bundle.zip in place and sign its SHA-256: the app only installs what the private key produced.
          sig=$(node scripts/sign-bundle.ts bundle.zip)
          jq -n --arg version "$VITE_APP_VERSION" --arg url "$url" \
            --arg checksum "$(jq -r .checksum <<<"$sig")" --arg sessionKey "$(jq -r .sessionKey <<<"$sig")" \
            '{version: $version, url: $url, checksum: $checksum, sessionKey: $sessionKey}' > latest.json
          gh release create "$tag" bundle.zip latest.json --title "Web $VITE_APP_VERSION" --notes "${NOTES:-Manual build}" --latest
          # Keep the three most recent web releases.
          gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("web-"))' \
            | tail -n +4 | xargs -r -n1 gh release delete --yes --cleanup-tag
