name: iOS app

# Builds an unsigned IPA and attaches it to the "ipa" pre-release. Only needed when native code or
# plugins change: web changes reach installed apps through the Web bundle workflow.
# Sideloading tools (SideStore, LiveContainer, AltStore…) sign it with your own Apple ID.
on:
  workflow_dispatch:

permissions:
  contents: write

# Each build deletes and recreates the "ipa" release: two at once could leave it empty.
concurrency:
  group: ipa-release

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Actions pinned by commit (a moved tag cannot change them); Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # no repo token left in .git for the build steps

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Version from commit time
        run: echo "VITE_APP_VERSION=0.1.$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - run: npm run build
      - run: npx cap sync ios

      # CURRENT_PROJECT_VERSION (CFBundleVersion) changes with each commit: that is how the updater
      # notices a new IPA and switches back to the web bundle shipped inside it.
      - name: Build app (no code signing)
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${VITE_APP_VERSION##*.}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry fretly.ipa Payload

      - name: Publish IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreated each time so the tag points at the commit that was built; the download URL stays the same.
          gh release delete ipa --yes --cleanup-tag 2>/dev/null || true
          gh release create ipa fretly.ipa --prerelease --target "$GITHUB_SHA" \
            --title "iOS app (unsigned IPA)" \
            --notes "Unsigned build of Fretly $VITE_APP_VERSION. Install it with a sideloading tool; later web updates arrive automatically."
